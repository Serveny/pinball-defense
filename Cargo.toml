[package]
name = "pinball-defense"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable optimizations for deps always
[profile.dev.package."*"]
opt-level = 3

# setting the number codegen units to 1 will further improve performances in a noticeable way,
# even for a release build (though the build itself will take longer to complete)
[profile.release]
codegen-units = 1

[features]
log = []

[dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.38.0"
bevy_asset_loader = "0.28.0"
avian2d = { version = "0.8.0" }
bevy_window_title_diagnostics = "0.20.0"
bevy_tweening = "0.17.0"
digits_iterator = "0.1.0"
rand = { version = "0.10.3", features = ["thread_rng"] }
moonshine-save = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_hanabi = { version = "0.20.0", default-features = false, features = ["3d"] }
#bevy_debug_grid = "0.1"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unchecked_time_subtraction = "warn"
manual_let_else = "warn"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
