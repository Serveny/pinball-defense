[package]
name = "pinball-defense"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable optimizations for deps always
[profile.dev.package."*"]
opt-level = 3

# setting the number codegen units to 1 will further improve performances in a noticeable way,
# even for a release build (though the build itself will take longer to complete)
[profile.release]
codegen-units = 1

[features]
log = []

[dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.37.0"
bevy_asset_loader = "0.27.0"
avian2d = { version = "0.7.0" }
bevy_window_title_diagnostics = "0.19.0"
bevy_tweening = "0.16.0"
digits_iterator = "0.1.0"
bevy_framepace = "0.22.0"
rand = { version = "0.10.2", features = ["thread_rng"] }
moonshine-save = "0.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
#bevy_debug_grid = "0.1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
